<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>retroGTA</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%23c4b49a'/></svg>" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="c"></canvas>

    <div id="hud">
      <div id="place-wrap">
        <div id="place" data-i18n="place"></div>
        <div id="sub" data-i18n="sub"></div>
      </div>
      <div id="speed"></div>
      <canvas id="map" width="168" height="168"></canvas>
      <div id="hint"></div>
      <div id="prompt"></div>
    </div>

    <button id="boot" type="button">
      <div class="boot-card">
        <div class="boot-kicker" data-i18n="bootKicker"></div>
        <div class="boot-title">retroGTA</div>
        <div class="boot-copy" data-i18n="bootCopy"></div>
        <div class="boot-keys" data-i18n="bootKeys"></div>
      </div>
    </button>

    <div id="settings">
      <button id="settings-toggle" type="button" data-i18n-aria="settings" aria-expanded="false" aria-controls="settings-panel">⚙</button>
      <div id="settings-panel" hidden>
        <div class="settings-label" data-i18n="language"></div>
        <div id="lang" role="group">
          <button type="button" data-lang="en">EN</button>
          <button type="button" data-lang="zh">中文</button>
        </div>
      </div>
    </div>

    <script type="module">
      import { initI18n } from '/src/i18n.js';
      initI18n();
    </script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
