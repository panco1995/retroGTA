<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#06090a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>retroGTA</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%23c4b49a'/></svg>" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="c"></canvas>

    <div id="hud" class="hidden">
      <div id="place-wrap">
        <div id="place" data-i18n="place"></div>
        <div id="sub" data-i18n="sub"></div>
      </div>
      <div id="speed"></div>
      <canvas id="map" width="168" height="168"></canvas>
      <div id="toast" role="status" aria-live="polite"></div>
    </div>

    <!-- Shown while a touch device in game is held portrait. -->
    <div id="rotate" class="hidden">
      <div class="rotate-phone" aria-hidden="true"></div>
      <div class="rotate-title" data-i18n="rotateTitle"></div>
      <div class="rotate-copy" data-i18n="rotateCopy"></div>
      <button type="button" id="rotate-go" class="controls-reset" data-i18n="rotateGo"></button>
    </div>

    <!-- Virtual controls. Only mounted on touch devices, and only while
         playing; the layout is landscape, the movement under the left thumb
         and the actions under the right. On foot the left thumb gets a stick;
         in a car it gets two arrows and the right hand a throttle. -->
    <div id="touch" class="hidden">
      <div id="touch-look"></div>
      <div id="touch-stick" class="touch-stick">
        <div id="touch-stick-knob" class="touch-stick-knob"></div>
      </div>
      <div id="touch-steer" class="touch-steer"></div>
      <div id="touch-buttons" class="touch-buttons"></div>
      <button type="button" id="touch-pause" class="touch-btn small touch-pause" data-i18n-aria="pauseTitle">II</button>
    </div>

    <div id="menu">
      <div id="menu-brand" class="menu-brand">
        <div class="boot-title">retroGTA</div>
        <div class="menu-author" data-i18n="menuAuthor"></div>
      </div>
      <div class="menu-card">
        <nav id="menu-home" class="menu-list">
          <button type="button" id="menu-start" data-i18n="menuStart"></button>
          <button type="button" data-page="collection" data-i18n="menuCollection"></button>
          <button type="button" data-page="settings" data-i18n="menuSettings"></button>
          <button type="button" data-page="about" data-i18n="menuAbout"></button>
        </nav>
        <section id="menu-about" class="menu-panel" hidden>
          <p class="about-copy" data-i18n="aboutCopy"></p>
          <ul class="about-meta">
            <li>
              <span class="about-key" data-i18n="aboutAuthor"></span>
              <span class="about-value">Panco</span>
            </li>
            <li>
              <span class="about-key" data-i18n="aboutEmail"></span>
              <a class="about-link" href="mailto:panco1995@hotmail.com">panco1995@hotmail.com</a>
            </li>
            <li>
              <span class="about-key" data-i18n="aboutHomepage"></span>
              <a class="about-link" href="https://github.com/panco1995/retroGTA" target="_blank" rel="noreferrer">github.com/panco1995/retroGTA</a>
            </li>
            <li>
              <span class="about-key" data-i18n="aboutProgress"></span>
              <span class="about-value" data-i18n="aboutProgressText"></span>
            </li>
          </ul>
        </section>
        <!-- Shared by the main menu and the pause menu; moved into whichever card opens it. -->
        <section id="settings-panel" class="menu-panel" hidden>
          <section id="settings-home" class="settings-page">
            <div class="settings-label" data-i18n="language"></div>
            <div id="lang-options" class="option-group" role="group"></div>
            <div class="settings-label settings-heading" data-i18n="view"></div>
            <div id="view-options" class="option-group" role="group"></div>
            <div class="settings-label settings-heading" data-i18n="controls"></div>
            <div class="option-group">
              <button type="button" data-page="controls" data-i18n="controlsKeyboard" class="kbd-only"></button>
              <button type="button" data-page="touch" data-i18n="controlsTouch" class="touch-only"></button>
            </div>
          </section>
          <section id="settings-controls-page" class="settings-page" hidden>
            <div class="settings-label" data-i18n="controlsKeyboard"></div>
            <div id="controls"></div>
            <button type="button" id="controls-reset" class="controls-reset" data-i18n="controlsReset"></button>
          </section>
          <section id="settings-touch-page" class="settings-page" hidden>
            <div class="settings-label" data-i18n="touchPad"></div>
            <div class="option-group" id="touch-pad-options" role="group"></div>
            <p class="settings-note" data-i18n="touchNote"></p>
          </section>
        </section>
        <button type="button" id="menu-back" class="menu-back" data-page="back" data-i18n="menuBack" hidden></button>
      </div>
    </div>

    <div id="pause" class="hidden">
      <div class="menu-card">
        <div class="boot-title" data-i18n="pauseTitle"></div>
        <nav id="pause-home" class="menu-list">
          <button type="button" id="pause-resume" data-i18n="pauseResume"></button>
          <button type="button" id="pause-restart" data-i18n="pauseRestart"></button>
          <button type="button" data-page="settings" data-i18n="menuSettings"></button>
          <button type="button" data-page="map" data-i18n="pauseMap"></button>
          <button type="button" data-page="cheats" data-i18n="pauseCheats"></button>
          <button type="button" data-page="collection" data-i18n="menuCollection"></button>
          <button type="button" id="pause-exit" data-i18n="pauseExit"></button>
        </nav>
        <section id="pause-cheats-panel" class="menu-panel" hidden>
          <div class="settings-label" data-i18n="cheatSpawn"></div>
          <label class="cheat-field">
            <span data-i18n="cheatVehicle"></span>
            <select id="cheat-vehicle-type"></select>
          </label>
          <button type="button" id="cheat-spawn" class="controls-reset" data-i18n="cheatSpawnButton"></button>
          <p id="cheat-status" class="cheat-status"></p>
        </section>
        <button type="button" id="pause-back" class="menu-back" data-page="back" data-i18n="menuBack" hidden></button>
      </div>
      <section id="pause-map-panel" class="menu-panel pause-map-panel" hidden>
        <div class="pause-map-heading" data-i18n="pauseMap"></div>
        <div class="pause-map-frame">
          <canvas id="pause-map-canvas"></canvas>
        </div>
        <button type="button" id="pause-map-back" class="menu-back" data-i18n="menuBack"></button>
      </section>
    </div>

    <!-- Shared by the main menu and the pause menu, like the settings panel. -->
    <section id="collection-panel" class="collection-panel" hidden>
      <header class="collection-head">
        <div class="collection-title" data-i18n="menuCollection"></div>
        <div id="collection-tabs" class="collection-tabs" role="tablist">
          <button type="button" role="tab" data-collection-tab="vehicles" data-i18n="collectionVehicles"></button>
          <button type="button" role="tab" data-collection-tab="people" data-i18n="collectionPeople"></button>
          <button type="button" role="tab" data-collection-tab="props" data-i18n="collectionProps"></button>
          <button type="button" role="tab" data-collection-tab="buildings" data-i18n="collectionBuildings"></button>
        </div>
        <button type="button" id="collection-back" class="collection-close" data-page="back" data-i18n="menuBack"></button>
      </header>
      <div class="collection-body">
        <nav id="collection-list" class="collection-list"></nav>
        <div class="collection-stage">
          <canvas id="collection-canvas"></canvas>
        </div>
      </div>
      <footer class="collection-foot">
        <div id="collection-hint" class="collection-hint"></div>
        <div class="collection-nav">
          <button type="button" id="collection-prev" class="collection-arrow" data-i18n-aria="collectionPrev">‹</button>
          <div class="collection-caption">
            <div id="collection-name" class="collection-name"></div>
            <div id="collection-count" class="collection-count"></div>
          </div>
          <button type="button" id="collection-next" class="collection-arrow" data-i18n-aria="collectionNext">›</button>
        </div>
        <div class="collection-views">
          <button type="button" id="collection-driver" class="collection-view" data-i18n="collectionDriver" aria-pressed="true" hidden></button>
          <button type="button" id="collection-interior" class="collection-view" data-i18n="collectionInterior" aria-pressed="false" hidden></button>
        </div>
      </footer>
    </section>

    <script type="module">
      import { initI18n } from '/src/i18n.js';
      import { initMenu } from '/src/menu.js';
      import { initBindings } from '/src/bindings.js';
      import { initCollection } from '/src/collection.js';
      import { initTouch } from '/src/touch.js';
      initI18n();
      initMenu();
      initBindings();
      initCollection();
      initTouch();
    </script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
