<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>retroGTA</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%23c4b49a'/></svg>" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="c"></canvas>

    <div id="hud" class="hidden">
      <div id="place-wrap">
        <div id="place" data-i18n="place"></div>
        <div id="sub" data-i18n="sub"></div>
      </div>
      <div id="speed"></div>
      <canvas id="map" width="168" height="168"></canvas>
      <div id="hint"></div>
      <div id="prompt"></div>
    </div>

    <div id="menu">
      <div class="menu-card">
        <div class="boot-kicker" data-i18n="bootKicker"></div>
        <div class="boot-title">retroGTA</div>
        <nav id="menu-home" class="menu-list">
          <button type="button" id="menu-start" data-i18n="menuStart"></button>
          <button type="button" data-menu="settings" data-i18n="menuSettings"></button>
          <button type="button" data-menu="about" data-i18n="menuAbout"></button>
        </nav>
        <section id="menu-settings" class="menu-panel" hidden>
          <div class="settings-label" data-i18n="language"></div>
          <div id="lang" role="group">
            <button type="button" data-lang="en">EN</button>
            <button type="button" data-lang="zh">中文</button>
          </div>
          <button type="button" class="menu-back" data-menu="home" data-i18n="menuBack"></button>
        </section>
        <section id="menu-about" class="menu-panel" hidden>
          <p class="about-copy" data-i18n="aboutCopy"></p>
          <p class="boot-keys" data-i18n="bootKeys"></p>
          <button type="button" class="menu-back" data-menu="home" data-i18n="menuBack"></button>
        </section>
      </div>
    </div>

    <div id="pause" class="hidden">
      <div class="menu-card">
        <div class="boot-title" data-i18n="pauseTitle"></div>
        <nav class="menu-list">
          <button type="button" id="pause-lang" data-i18n="pauseLang"></button>
          <button type="button" id="pause-restart" data-i18n="pauseRestart"></button>
          <button type="button" id="pause-exit" data-i18n="pauseExit"></button>
        </nav>
      </div>
    </div>

    <script type="module">
      import { initI18n } from '/src/i18n.js';
      import { initMenu } from '/src/menu.js';
      initI18n();
      initMenu();
    </script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
